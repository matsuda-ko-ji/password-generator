<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="container">
    <h1>Password Generator</h1>

    <section class="length">
      <label for="length">パスワード長</label>
      <input type="number" id="length" min="4" max="32" value="12" />
    </section>

    <section class="options">
      <p>使用する文字種</p>
      <label><input type="checkbox" id="uppercase" checked /> 英大文字</label>
      <label><input type="checkbox" id="lowercase" checked /> 英小文字</label>
      <label><input type="checkbox" id="numbers" checked /> 数字</label>
      <label><input type="checkbox" id="symbols" /> 記号</label>
    </section>

    <button id="generate">生成する</button>

    <section class="result">
      <input type="text" id="result" readonly />
      <button id="copy">コピー</button>
    </section>
  </main>

  <script src="js/passwordGenerator.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
